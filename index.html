<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="언제나 가난한 저희 개천박컴퍼니와 함께할 영광을 드립니다.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://oaoaoaoartrt-creator.github.io/gaecheonbak/">
  <meta property="og:title" content="개천박컴퍼니 2기 구인">
  <meta property="og:description" content="언제나 가난한 저희 개천박컴퍼니와 함께할 영광을 드립니다.">
  <meta property="og:image" content="https://oaoaoaoartrt-creator.github.io/gaecheonbak/images/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>개천박컴퍼니 2기 구인</title>
  <meta name="theme-color" content="#f3f0ea">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="개천박">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --paper: #f3f0ea;
      --paper-deep: #ebe6dc;
      --surface: #faf8f4;
      --ink: #1c1b18;
      --ink-soft: #3f3c36;
      --muted: #6b665d;
      --line: #d5cfc4;
      --line-strong: #b9b2a5;
      --accent: #7a4332;
      --accent-soft: rgba(122, 67, 50, 0.12);
      --radius: 2px;
      --nav-h: 64px;
      --max: 1040px;
      --font-serif: "Noto Serif KR", "Source Han Serif K", "Noto Serif CJK KR", serif;
      --font-sans: Pretendard, "Pretendard Variable", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img { max-width: 100%; display: block; }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .skip {
      position: absolute;
      left: 12px;
      top: -40px;
      z-index: 100;
      background: var(--ink);
      color: var(--surface);
      padding: 8px 12px;
      font-size: 13px;
    }
    .skip:focus { top: 12px; }

    /* ---------- Nav ---------- */
    .nav {
      position: sticky;
      top: 0;
      z-index: 40;
      height: var(--nav-h);
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner,
    .wrap {
      width: min(var(--max), calc(100% - 48px));
      margin: 0 auto;
    }

    .nav-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      display: inline-block;
      padding: 6px 10px;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
    }

    .nav-links a:hover {
      color: var(--ink);
    }

    /* ---------- Hero ---------- */
    .hero {
      padding: 88px 0 72px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 28px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .kicker::before {
      content: "";
      display: block;
      width: 28px;
      height: 1px;
      background: var(--line-strong);
    }

    .hero h1 {
      margin: 0 0 24px;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: clamp(2.125rem, 5.4vw, 3.5rem);
      line-height: 1.28;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .lede {
      margin: 0;
      max-width: 34em;
      font-size: 1.0625rem;
      line-height: 1.85;
      color: var(--ink-soft);
    }

    /* ---------- Actions ---------- */
    .recruit {
      padding: 56px 0 88px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .action {
      appearance: none;
      -webkit-appearance: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
      width: 100%;
      margin: 0;
      padding: 28px 26px 26px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease, border-color 0.22s ease;
    }

    .action:hover {
      border-color: var(--ink);
    }

    .action[aria-expanded="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--surface);
    }

    .action-index {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .action[aria-expanded="true"] .action-index {
      color: #c8c0b4;
    }

    .action-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .action-hint {
      margin-top: auto;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .action[aria-expanded="true"] .action-hint {
      color: #c8c0b4;
    }

    .action-hint::after {
      content: "열기";
    }

    .action[aria-expanded="true"] .action-hint::after {
      content: "닫기";
    }

    /* ---------- Panels ---------- */
    .panels {
      position: relative;
      margin-top: 16px;
    }

    .panel {
      display: none;
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 48px 40px;
    }

    .panel.is-open {
      display: block;
    }

    .panel.is-open.fx-clean {
      animation: fadeSlide 0.42s ease both;
    }

    .panel.is-open.fx-flashy {
      animation: fadeSlide 0.3s ease both;
    }

    .panel-label {
      margin: 0 0 28px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    /* People */
    .people {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 32px 24px;
    }
    @media (max-width: 900px) and (min-width: 801px) {
      .people { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .person {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar {
      position: relative;
      flex: 0 0 80px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--paper-deep);
      border: 1px solid var(--line);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .avatar span {
      font-family: var(--font-serif);
      font-size: 1.375rem;
      font-weight: 600;
      color: var(--ink-soft);
      line-height: 1;
    }

    /* src가 비어 있으면 이니셜만 보이고, URL을 넣으면 사진이 이니셜을 가립니다. */
    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar:has(img) span {
      display: none;
    }

    /* 직책 왕관 테두리 (사내 메신저와 동일한 금속 링·왕관, 80px 아바타에 맞춤) */
    .pf {
      --s: 80px;
      --ring-bg: var(--surface);
      --band: clamp(3px, calc(var(--s) * 0.075 + 1.2px), 7px);
      position: relative;
      flex: 0 0 var(--s);
      width: var(--s);
      height: var(--s);
    }
    .pf > .avatar {
      flex: none;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .pf:not(.metal) > .avatar {
      box-shadow: 0 0 0 1.5px var(--ring-bg), 0 0 0 2.5px #c8c0b2;
    }
    .pf.metal::before,
    .pf.metal::after {
      content: "";
      position: absolute;
      inset: calc(var(--band) * -1);
      border-radius: 50%;
      z-index: 0;
    }
    .pf.metal::before {
      background: var(--metal);
      box-shadow: 0 0 0 0.6px var(--edge), inset 0 0 0 0.6px var(--edge-in);
    }
    .pf.metal::after {
      background: conic-gradient(from 0deg, transparent 0 62%, rgba(255,255,255,0.55) 70%, transparent 78% 100%);
      animation: pf-sheen 9s linear infinite;
    }
    .pf.metal > .avatar {
      border: 1.5px solid var(--inner);
      box-shadow: 0 0 0 2px var(--ring-bg);
    }
    .pf.f-platinum_crown {
      --metal: conic-gradient(from 210deg, #ffffff, #c5e6f5 8%, #f8fdff 16%, #9cc9e0 24%, #ffffff 34%, #d7eef8 42%, #8ebad2 52%, #f4fbff 62%, #b3d6e8 72%, #ffffff 82%, #cfe8f4 90%, #ffffff);
      --edge: rgba(90, 132, 156, 0.5);
      --edge-in: rgba(255, 255, 255, 0.88);
      --inner: #9dbcd0;
    }
    .pf.f-gold_crown {
      --metal: conic-gradient(from 200deg, #eedcaa, #b08a44 14%, #e3c785 27%, #8d6a2e 41%, #d8b874 55%, #a17d3a 70%, #ecd8a2 84%, #eedcaa);
      --edge: rgba(92, 66, 26, 0.6);
      --edge-in: rgba(255, 246, 222, 0.55);
      --inner: #a98540;
    }
    @keyframes pf-sheen { to { transform: rotate(360deg); } }
    .pf.f-platinum_crown::after {
      background: conic-gradient(from 0deg, transparent 0 58%, rgba(160, 216, 240, 0.28) 64%, rgba(255,255,255,0.9) 70%, rgba(200, 230, 255, 0.35) 74%, transparent 82% 100%);
    }
    .pf.f-platinum_crown .crown { filter: drop-shadow(0 0.6px 0.5px rgba(70, 110, 130, 0.28)); }
    .pf.f-platinum_crown .sparks { position: absolute; inset: calc(var(--band) * -2.2); z-index: 3; pointer-events: none; overflow: visible; }
    .pf.f-platinum_crown .sparks i {
      position: absolute; display: block; width: calc(var(--s) * 0.09); height: calc(var(--s) * 0.09);
      background: #fff; clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      filter: drop-shadow(0 0 1.1px rgba(200, 236, 255, 0.95)); opacity: 0;
      animation: pf-twinkle 3.6s ease-in-out infinite;
    }
    .pf.f-platinum_crown .sparks i:nth-child(1) { top: 2%; left: 78%; animation-duration: 3.4s; animation-delay: 0.15s; }
    .pf.f-platinum_crown .sparks i:nth-child(2) { top: -6%; left: 22%; width: calc(var(--s) * 0.07); height: calc(var(--s) * 0.07); animation-duration: 4.1s; animation-delay: 1.15s; }
    .pf.f-platinum_crown .sparks i:nth-child(3) { bottom: 6%; right: 0; animation-duration: 3.8s; animation-delay: 2.05s; }
    .pf.f-platinum_crown .sparks i:nth-child(4) { top: 42%; left: -6%; width: calc(var(--s) * 0.06); height: calc(var(--s) * 0.06); animation-duration: 4.4s; animation-delay: 0.75s; }
    @keyframes pf-twinkle {
      0%, 62%, 100% { opacity: 0; transform: scale(0.35); }
      70% { opacity: 1; transform: scale(1); }
      78% { opacity: 0.25; transform: scale(0.6); }
      86% { opacity: 0.95; transform: scale(1.08); }
    }
    .pf .crown {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: calc(var(--s) * -0.33);
      width: calc(var(--s) * 0.5);
      height: auto;
      transform: translateX(-66%) rotate(-12deg);
      transform-origin: 50% 100%;
      overflow: visible;
      pointer-events: none;
      filter: drop-shadow(0 0.6px 0.5px rgba(28, 27, 24, 0.28));
    }
    #panel-people .people { padding-top: 16px; }

    .person-role {
      margin: 0 0 4px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .person-name {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* Work */
    .work-lead {
      margin: 0 0 24px;
      font-size: 15px;
      color: var(--ink-soft);
    }

    .work-lead strong {
      font-weight: 600;
      color: var(--ink);
    }

    .work-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .work-item {
      padding: 28px 24px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .panel.is-open.fx-flashy .work-item {
      animation: popIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .panel.is-open.fx-flashy .work-item:nth-child(2) {
      animation-delay: 0.12s;
    }

    .panel.is-open.fx-flashy::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(122, 67, 50, 0.16), transparent);
      animation: sweep 0.85s ease forwards;
    }

    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Benefits */
    .empty-note {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.3;
    }

    /* ---------- Footer ---------- */
    .footer {
      border-top: 1px solid var(--line);
      padding: 40px 0 48px;
    }

    .footer-inner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
    }

    .footer-line {
      margin: 0;
      font-size: 14px;
      color: var(--ink-soft);
    }

    .copyright {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ---------- Motion ---------- */
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes sweep {
      from { transform: translateX(-40%); opacity: 0; }
      25%  { opacity: 1; }
      to   { transform: translateX(280%); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .panel.is-open.fx-clean,
      .panel.is-open.fx-flashy,
      .panel.is-open.fx-flashy .work-item,
      .panel.is-open.fx-flashy::before {
        animation: none;
      }
      .pf.metal::after { animation: none; transform: rotate(-40deg); }
      .pf.f-platinum_crown .sparks i { animation: none; opacity: 0; }
      .pf.f-platinum_crown .sparks i:nth-child(1) { opacity: 0.65; }
      .pf.f-platinum_crown .sparks i:nth-child(3) { opacity: 0.35; }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 800px) {
      .nav-inner,
      .wrap { width: min(var(--max), calc(100% - 32px)); }

      .hero { padding: 64px 0 56px; }

      .actions,
      .people,
      .work-list {
        grid-template-columns: 1fr;
      }

      .panel { padding: 36px 24px; }

      .footer-inner {
        flex-direction: column;
        gap: 8px;
      }
    }

    @media (max-width: 560px) {
      .nav-links a { padding: 6px 6px; font-size: 12px; }
      .hero { padding: 48px 0 44px; }
      .recruit { padding: 36px 0 64px; }
      .action { padding: 22px 20px; }
    }

    /* ---------- 상단 메뉴 (모든 페이지 공통: 간격 고정, 선택 표시는 밑줄·색만) ---------- */
    .nav-inner { gap: 24px; }
    .logo { font-size: 17px; white-space: nowrap; }
    .nav-links { gap: 12px; }
    .nav-links a { padding: 6px 10px; font-size: 13px; font-weight: 400; letter-spacing: 0.02em; white-space: nowrap; border: 0; box-shadow: none; }
    .nav-links a[aria-current="page"] { color: var(--ink); border: 0; box-shadow: inset 0 -1px 0 var(--ink); }
    @media (max-width: 560px) {
      .nav-inner { gap: 12px; }
      .nav-links { gap: 12px; }
      .nav-links a { padding: 6px 6px; font-size: 12px; }
    }
    @media (max-width: 400px) {
      .nav-inner { gap: 12px; }
      .logo { font-size: 17px; }
      .nav-links { gap: 12px; }
      .nav-links a { padding: 6px 6px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#recruit">본문으로 건너뛰기</a>

  <header class="nav">
    <div class="nav-inner">
      <a class="logo" href="#top">개천박컴퍼니</a>
      <nav aria-label="바로가기">
        <ul class="nav-links">
          <li><a href="#panel-people">인원 소개</a></li>
          <li><a href="#panel-work">일 소개</a></li>
          <li><a href="#panel-benefits">혜택 소개</a></li>
          <li><a href="messenger.html">사내 메신저</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="page-title">
      <div class="wrap">
        <p class="kicker">채용 공고</p>
        <h1 id="page-title">개천박컴퍼니 2기 구인</h1>
        <p class="lede">언제나 가난한 저희 개천박컴퍼니와 함께할 영광을 드립니다.</p>
      </div>
    </section>

    <section class="recruit" id="recruit" aria-label="소개">
      <div class="wrap">
        <div class="actions" aria-label="소개 항목">
          <button
            class="action"
            id="btn-people"
            type="button"
            aria-expanded="false"
            aria-controls="panel-people"
            data-panel="people">
            <span class="action-index">01</span>
            <span class="action-title">인원 소개</span>
            <span class="action-hint"></span>
          </button>

          <button
            class="action"
            id="btn-work"
            type="button"
            aria-expanded="false"
            aria-controls="panel-work"
            data-panel="work">
            <span class="action-index">02</span>
            <span class="action-title">일 소개</span>
            <span class="action-hint"></span>
          </button>

          <button
            class="action"
            id="btn-benefits"
            type="button"
            aria-expanded="false"
            aria-controls="panel-benefits"
            data-panel="benefits">
            <span class="action-index">03</span>
            <span class="action-title">혜택 소개</span>
            <span class="action-hint"></span>
          </button>
        </div>

        <div class="panels">
          <div
            class="panel fx-clean"
            id="panel-people"
            role="region"
            aria-labelledby="btn-people"
            hidden>
            <p class="panel-label">인원 소개</p>
            <div class="people">
              <article class="person">
                <div class="pf metal f-platinum_crown" title="다이아몬드 왕관 테두리">
                  <div class="avatar">
                    <img src="images/seolpyo.jpg" alt="사장 설표">
                    <span aria-hidden="true">설</span>

    <defs>
      <linearGradient id="cr-platinum_crown-body" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#e8f5fb"/><stop offset="0.7" stop-color="#b9d8ea"/><stop offset="1" stop-color="#8fb8ce"/></linearGradient>

      <linearGradient id="cr-gold_crown-band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a259"/><stop offset="1" stop-color="#7f5d25"/></linearGradient>

  <script>
    (function () {
      const buttons = Array.from(document.querySelectorAll(".action"));
      const panels = Array.from(document.querySelectorAll(".panel"));
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function closeAll() {
        buttons.forEach(function (btn) {
          btn.setAttribute("aria-expanded", "false");
        });
        panels.forEach(function (panel) {
          panel.hidden = true;
          panel.classList.remove("is-open");
        });
      }

      function openPanel(id) {
        closeAll();
        const btn = document.getElementById("btn-" + id);
        const panel = document.getElementById("panel-" + id);
        if (!btn || !panel) return;
        btn.setAttribute("aria-expanded", "true");
        panel.hidden = false;
        panel.classList.remove("is-open");
        void panel.offsetWidth;
        panel.classList.add("is-open");
        if (id === "work" && !reduceMotion) {
          burst(panel);
        }
      }

      function toggle(id) {
        const btn = document.getElementById("btn-" + id);
        const isOpen = btn && btn.getAttribute("aria-expanded") === "true";
        if (isOpen) closeAll();
        else openPanel(id);
      }

      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          toggle(btn.getAttribute("data-panel"));
        });
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeAll();
      });

      document.querySelectorAll('.nav-links a[href^="#panel-"]').forEach(function (link) {
        link.addEventListener("click", function (event) {
          event.preventDefault();
          const id = link.getAttribute("href").replace("#panel-", "");
          openPanel(id);
          const panel = document.getElementById("panel-" + id);
          if (panel) {
            panel.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
          }
        });
      });

      function burst(panel) {
        const canvas = document.getElementById("fx-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const rect = panel.getBoundingClientRect();
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const width = rect.width;
        const height = rect.height;
        const originX = width * 0.5;
        const originY = 72;
        const colors = ["#7a4332", "#1c1b18", "#c4a574", "#8d6a4a", "#d5cfc4"];
        const particles = [];
        const count = 36;

        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
          const speed = 1.6 + Math.random() * 3.8;
          particles.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.4,
            size: 1.5 + Math.random() * 2.6,
            color: colors[i % colors.length],
            life: 1,
            decay: 0.016 + Math.random() * 0.012,
            square: Math.random() > 0.45
          });
        }

        let running = true;
        const start = performance.now();

        function frame(now) {
          if (!running) return;
          ctx.clearRect(0, 0, width, height);
          let alive = 0;
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.vy += 0.045;
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            if (p.life <= 0) continue;
            alive += 1;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            if (p.square) {
              ctx.fillRect(p.x, p.y, p.size, p.size);
            } else {
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * 0.55, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.globalAlpha = 1;
          if (alive > 0 && now - start < 1400) {
            requestAnimationFrame(frame);
          } else {
            ctx.clearRect(0, 0, width, height);
            running = false;
          }
        }

        requestAnimationFrame(frame);
      }
    })();
  </script>
