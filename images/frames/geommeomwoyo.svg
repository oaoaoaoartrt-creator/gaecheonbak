<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" aria-hidden="true">
  <defs>
    
    <filter id="gm-sh" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="1.8" flood-color="#3a3834" flood-opacity=".32"/>
    </filter>
    <filter id="gm-glow" x="-50%" y="-50%" width="200%" height="200%">
