      <stop offset=".35" stop-color="#ffb020"/>
      <stop offset=".7" stop-color="#ff6010"/>
      <stop offset="1" stop-color="#c03000"/>
    </linearGradient>
    <radialGradient id="gm-spec" cx="30%" cy="26%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".32" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gm-plasma" x1="0" y1="0" x2="1" y2="1">
