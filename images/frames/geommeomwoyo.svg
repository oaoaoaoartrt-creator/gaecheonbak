      <stop offset=".5" stop-color="#fff4c8"/>
      <stop offset=".75" stop-color="#ff8020"/>
      <stop offset="1" stop-color="#c02800" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="gm-diskglow" cx="50%" cy="50%" r="50%">
